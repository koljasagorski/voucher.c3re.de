name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: voucher
          POSTGRES_PASSWORD: voucher
          POSTGRES_DB: voucher
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U voucher"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Check for missing migrations
        run: DEBUG=1 python manage.py makemigrations --check --dry-run
      - name: Run tests
        env:
          DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgres://voucher:voucher@localhost:5432/voucher' || '' }}
        run: python -m pytest

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t voucher .
