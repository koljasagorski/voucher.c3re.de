{% extends "voucher/base.html" %}
{% block main_class %}wide{% endblock %}
{% block content %}
<p class="subnav">
  <a href="{% url 'voucher:admin_waitlist' %}">Warteliste</a>
  <a href="{% url 'voucher:admin_slots' %}">Slots</a>
  <a href="{% url 'voucher:admin_mails' %}">Mail-Log</a>
  <a href="{% url 'voucher:admin_users' %}">Freischaltung</a>
  <a href="{% url 'voucher:admin_audit' %}">Audit-Log</a>
  <a href="{% url 'voucher:admin_events' %}">Events</a>
</p>
{% if events and events|length > 1 %}
  <form method="get" class="inline">
    <select name="event" onchange="this.form.submit()" aria-label="Event">
      {% for e in events %}<option value="{{ e.slug }}" {% if e == event %}selected{% endif %}>{{ e.name }}{% if e.is_active %} (aktiv){% endif %}</option>{% endfor %}
    </select>
  </form>
{% endif %}
{% block admin_content %}{% endblock %}
{% endblock %}
