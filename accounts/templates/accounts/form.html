{% extends "voucher/base.html" %}
{% block title %}{{ title }} – Voucher-Warteliste{% endblock %}
{% block content %}
<h1>{{ title }}</h1>
{% if intro %}<p>{{ intro }}</p>{% endif %}
<div class="card">
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form.non_field_errors }}
    {{ form.as_div }}
    <div class="actions"><button type="submit">{{ button }}</button></div>
  </form>
</div>
{% endblock %}
